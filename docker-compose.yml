version: '3.8'
services:
  frontend:
    build: ./client
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000

  backend:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379

  redis:
    image: redis:alpine
